# Added to WebODM's own docker-compose.yml and .dev.yml by dev/webodm.sh: a WebODM checkout runs in dev mode with
# this repo's plugin mounted as coreplugins/dji-thermal, under its own container names (DT_PREFIX), port and
# volumes, so it can run beside another WebODM (whose names and port it would take). The images (DT_*_IMAGE) are
# each version's, pinned by digest in dev/webodm.sh.
# The tests' images and DJI's SDK zip (never in git) are mounted read-only from DT_SAMPLES_DIR, DT_FLIGHT_DIR and
# DT_SDK_ZIP (see dev/webodm.sh).
services:
  db:
    image: ${DT_DB_IMAGE}
    container_name: ${DT_PREFIX}-db
  broker:
    image: ${DT_BROKER_IMAGE}
    container_name: ${DT_PREFIX}-broker
  node-odx-1:
    image: ${DT_NODE_IMAGE}
    container_name: ${DT_PREFIX}-node-odx-1
    expose:
      - "3000"
    restart: unless-stopped
    oom_score_adj: 500
  webapp:
    image: ${DT_WEBAPP_IMAGE}
    container_name: ${DT_PREFIX}-webapp
    depends_on:
      - node-odx-1
    ports: !override
      - "${WO_PORT}:8000/tcp"
      - "${DT_LIVERELOAD_PORT}:35729"
    volumes: &volumes
      - ${DT_PLUGIN_DIR}:/webodm/coreplugins/dji-thermal
      - ${DT_SAMPLES_DIR}:/test-images/samples:ro
      - ${DT_FLIGHT_DIR}:/test-images/flight:ro
      - ${DT_SDK_ZIP}:/test-images/dji_thermal_sdk.zip:ro
    environment:
      WO_DEFAULT_NODES: ${WO_DEFAULT_NODES}
      DJI_THERMAL_SAMPLES_DIR: /test-images/samples
      DJI_THERMAL_FLIGHT_DIR: /test-images/flight
      DJI_THERMAL_SDK_ZIP: /test-images/dji_thermal_sdk.zip
  worker:
    image: ${DT_WEBAPP_IMAGE}
    container_name: ${DT_PREFIX}-worker
    volumes: *volumes
    environment: &environment
      DJI_THERMAL_SAMPLES_DIR: /test-images/samples
      DJI_THERMAL_FLIGHT_DIR: /test-images/flight
      DJI_THERMAL_SDK_ZIP: /test-images/dji_thermal_sdk.zip
