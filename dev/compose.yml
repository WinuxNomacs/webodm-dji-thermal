# Added to WebODM's own docker-compose.yml, .nodeodm.yml and .dev.yml by dev/webodm.sh: the checkout in
# ignored/WebODM runs in dev mode with this repo's plugin mounted as coreplugins/dji-thermal, under its own
# container names, port and volumes, so it can run beside another WebODM (whose names and port it would take).
# The images are pinned by digest: `latest` is rebuilt from WebODM's master, and a local `latest` tag can be another
# build (a fork's). Upgrading: pull the new images, update ignored/WebODM to the commit they were built from, move
# the digests, `dev/webodm.sh up`, run the tests.
# The tests' images and DJI's SDK zip (never in git) are mounted read-only from DT_SAMPLES_DIR, DT_FLIGHT_DIR and
# DT_SDK_ZIP (see dev/webodm.sh).
x-webapp-image: &webapp-image webodm/webodm_webapp@sha256:55a1d7d1eee7c1220edfb75da2b67044ebcda1b6b61b25a369cc5c087bb47d71
services:
  db:
    image: webodm/webodm_db@sha256:03f18ec0089325ec2b8975ba1781277bcdc212b6d86c9de33f6409d313e90430
    container_name: dt-db
  broker:
    container_name: dt-broker
  node-odx-1:
    image: webodm/nodeodx@sha256:d75a3957076af0efbbbd03a6c6d753b29802b9f1715235b42c5d7154ba68fa55
    container_name: dt-node-odx-1
  webapp:
    image: *webapp-image
    container_name: dt-webapp
    ports: !override
      - "${WO_PORT}:8000/tcp"
      - "${DT_LIVERELOAD_PORT}:35729"
    volumes: &volumes
      - ${DT_PLUGIN_DIR}:/webodm/coreplugins/dji-thermal
      - ${DT_SAMPLES_DIR}:/test-images/samples:ro
      - ${DT_FLIGHT_DIR}:/test-images/flight:ro
      - ${DT_SDK_ZIP}:/test-images/dji_thermal_sdk.zip:ro
    environment: &environment
      DJI_THERMAL_SAMPLES_DIR: /test-images/samples
      DJI_THERMAL_FLIGHT_DIR: /test-images/flight
      DJI_THERMAL_SDK_ZIP: /test-images/dji_thermal_sdk.zip
  worker:
    image: *webapp-image
    container_name: dt-worker
    volumes: *volumes
    environment: *environment
